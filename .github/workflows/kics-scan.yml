# Runs KICS (Keeping Infrastructure as Code Secure) against every Terraform
# module in this repo. The KICS scan runs via a Docker-pinned image rather
# than the checkmarx/kics-github-action marketplace action, after that
# action was found to be supply-chain compromised (March and April 2026).
#
# ⚠️  SUPPLY CHAIN SECURITY WARNING — READ BEFORE UPDATING THE DIGEST BELOW ⚠️
#
# The checkmarx/kics Docker Hub repository was compromised TWICE in 2026:
#
#   • March 19, 2026 (TeamPCP / Trivy supply chain attack): Checkmarx
#     publisher credentials were first obtained, enabling follow-on attacks.
#
#   • April 22, 2026 (DockerHub push, 14:17–15:41 UTC): A threat actor used
#     those stolen Checkmarx credentials to overwrite five existing tags on
#     Docker Hub (latest, v2.1.20, v2.1.20-debian, alpine, debian) and push
#     two new rogue tags (v2.1.21, v2.1.21-debian). The malicious images ran
#     the legitimate KICS scan AND silently encrypted + exfiltrated scan
#     output (which contains secrets/credentials from IaC files) to an
#     attacker-controlled endpoint at audit.checkmarx[.]cx.
#
#   • May 2026: The Checkmarx Jenkins AST plugin was separately compromised
#     using tokens stolen during the April incident.
#
# The tag pinned below (v2.1.9) was NOT among the overwritten tags. However,
# Docker tags are mutable — a digest pin is the only safe reference.
#
# BEFORE CHANGING THE DIGEST:
#   1. Pull the image independently:
#        docker pull checkmarx/kics:<TAG>
#   2. Verify the digest matches what Checkmarx published on their official
#      GitHub release page (https://github.com/checkmarx/kics/releases):
#        docker inspect --format='{{index .RepoDigests 0}}' checkmarx/kics:<TAG>
#   3. Cross-check against the known-safe digests listed in Checkmarx's
#      official security update: https://checkmarx.com/blog/checkmarx-security-update-april-22/
#   4. Update the digest AND the tag comment together so they stay in sync.
#   5. Note the verification date and source in a comment next to the digest.
#
# Never scan with a bare/unverified tag in CI — a tag can be silently
# repointed to a malicious digest without any change to the workflow file.

name: KICS Security Scan

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

  workflow_call: 
    inputs:
      scan-path:
        description: 'Path to scan with KICS'
        required: true
        type: string
        default: '.'

concurrency:
  group: kics-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  pull-requests: write

jobs:
  kics:
    name: KICS Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run KICS scan (Docker-pinned image)
        run: |
          mkdir -p kics-results
          docker run --rm \
            -v "${{ github.workspace }}:/path:ro" \
            -v "${{ github.workspace }}/kics-results:/output" \
            checkmarx/kics:v2.1.9@sha256:d28b657224d2a80b1a8b4d26b383a8449e62572651ada6208984abbe1f934b60 \
            scan \
            -p /path \
            -o /output \
            -c /path/.kics/config.yml \
            --report-formats sarif,json \
            --exclude-paths /path/.git,/path/.github || true

      - name: Upload full KICS results as an artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kics-results
          path: kics-results/
          retention-days: 30

      - name: Fail the build on MEDIUM, HIGH or CRITICAL findings
        run: |
          python3 - <<'PYEOF'
          import json
          import sys
          import os

          if not os.path.exists("kics-results/results.json"):
              print("No KICS results file found - scan may have failed or produced no output")
              sys.exit(0)

          with open("kics-results/results.json") as f:
              data = json.load(f)

          counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0}
          for query in data.get("queries", []):
              severity = query.get("severity", "").upper()
              if severity in counts:
                  counts[severity] += len(query.get("files", []))

          print(f"CRITICAL findings: {counts['CRITICAL']}")
          print(f"HIGH findings:     {counts['HIGH']}")
          print(f"MEDIUM findings:   {counts['MEDIUM']}")

          if sum(counts.values()) > 0:
              print("Failing build: unresolved MEDIUM/HIGH/CRITICAL findings. "
                    "Fix them or document a justified suppression in "
                    ".kics/config.yml + .kics/SUPPRESSIONS.md.")
              sys.exit(1)
          PYEOF
