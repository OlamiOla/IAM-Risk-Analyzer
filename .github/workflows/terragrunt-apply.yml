name: Terragrunt Apply

on:
  push:
    branches:
      - main
      - riskanalyzer

  pull_request:
    branches: [main]

  workflow_dispatch: {}

permissions:
  id-token: write
  contents: read
  security-events: read
  pull-requests: write
  actions: read

concurrency:
  group: tg-apply-${{ github.ref }}
  cancel-in-progress: false # never cancel an in-progress apply

env:
  TERRAFORM_VERSION: "1.15.8"
  TERRAGRUNT_VERSION: "1.1.0"

jobs:
  kics-scan:
    name: KICS Scan
    uses: ./.github/workflows/kics-scan.yml
    with:
      scan-path: '.'
    permissions:
      contents: read
      id-token: write
      security-events: write
      actions: read
      pull-requests: write

  apply:
    name: Apply (dev)
    runs-on: ubuntu-latest
    # NOTE: "development" must be configured under
    # Settings → Environments → development → Required reviewers.
    # Add yourself (or a reviewer) there — without this, the environment
    # tag alone does NOT block the job; it just labels it.
    needs: kics-scan
    defaults:
      run:
        working-directory: live/dev
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Setup Terragrunt
        run: |
          curl -Lo terragrunt "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64"
          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/
          terragrunt --version

      - name: Terragrunt Init
        id: init
        run: terragrunt run --all --non-interactive --parallelism 1 -- init
        continue-on-error: false


      - name: Terragrunt Plan
        id: plan
        run: |
          set -o pipefail
          terragrunt run --all --non-interactive --parallelism 1 -- plan -lock=false 2>&1 | tee plan_output.txt


      - name: Terragrunt Apply
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: terragrunt run --all --non-interactive --parallelism 1 -- apply -auto-approve

      - name: Get Outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
           set -o pipefail
           terragrunt run --all --non-interactive --parallelism 1 -- output 2>&1 | tee outputs.txt

      - name: Upload Outputs
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: live-outputs
          path: live/dev/outputs.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Notify Slack
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: slackapi/slack-github-action@37ebaef184d7626c5f204ab8d3baff4262dd30f0 # v1.27.0
        with:
          payload: |
            {
              "text": "Terragrunt apply to dev: ${{ job.status }}"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}